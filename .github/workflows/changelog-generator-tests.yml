name: Changelog generator tests

on:
  pull_request:
    paths:
      - "tools/changelog-generator/**"
      - ".github/workflows/changelog-generator-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/changelog-generator/**"
      - ".github/workflows/changelog-generator-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tools/changelog-generator -p 'test_*.py' -v
